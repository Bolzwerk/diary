name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fortlaufende Versionsnummer, damit neue APKs sich über alte installieren lassen.
      TAGWERK_VERSION_CODE: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit- und Screenshot-Tests
        run: ./gradlew testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - name: Release-Keystore einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.TAGWERK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TAGWERK_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Kein Release-Keystore hinterlegt – es wird nur die Debug-APK gebaut."
          fi

      - name: Release-APK bauen
        if: env.TAGWERK_KEYSTORE_PATH != ''
        env:
          TAGWERK_KEYSTORE_PASSWORD: ${{ secrets.TAGWERK_KEYSTORE_PASSWORD }}
          TAGWERK_KEY_ALIAS: ${{ secrets.TAGWERK_KEY_ALIAS }}
          TAGWERK_KEY_PASSWORD: ${{ secrets.TAGWERK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Release-APK hochladen
        if: env.TAGWERK_KEYSTORE_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: tagwerk-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tagwerk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Testberichte hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
